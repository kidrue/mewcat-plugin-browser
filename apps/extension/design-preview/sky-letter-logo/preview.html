<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>译趣喵 · 白猫来信 Logo</title>
        <style>
            @font-face {
                font-family: "寒蝉全圆体";
                src: url("../../src/public/assets/fonts/chill-round-regular.woff2")
                    format("woff2");
                font-display: swap;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 48px 24px;
                background: #f2f8fe;
                color: #203b57;
                font:
                    16px/1.8 "寒蝉全圆体",
                    "Microsoft YaHei",
                    sans-serif;
            }
            main {
                max-width: 1000px;
                margin: auto;
            }
            h1 {
                font-size: 32px;
                font-weight: 400;
                margin: 0 0 8px;
            }
            h2 {
                font-size: 20px;
                font-weight: 400;
                margin: 0 0 20px;
            }
            p {
                margin: 0;
                color: #4d6780;
            }
            .intro {
                margin-bottom: 28px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }
            .card {
                padding: 28px;
                background: #fff;
                border: 1px solid #d7e7f3;
                border-radius: 20px;
            }
            .primary {
                display: grid;
                place-items: center;
                gap: 16px;
            }
            .primary img {
                width: min(100%, 300px);
                height: auto;
            }
            img {
                display: block;
                object-fit: contain;
            }
            figure {
                margin: 0;
            }
            .sizes {
                display: flex;
                gap: 24px;
                align-items: end;
                flex-wrap: wrap;
            }
            .sizes figure {
                display: grid;
                justify-items: center;
                gap: 12px;
                min-width: 48px;
            }
            figcaption {
                font:
                    12px/1.5 ui-monospace,
                    Consolas,
                    monospace;
                color: #4d6780;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 14px;
                margin-top: 24px;
                padding: 20px;
                border-radius: 14px;
                background: #f2f8fe;
            }
            .brand img {
                width: 48px;
                height: 48px;
            }
            .brand strong {
                font-size: 20px;
                font-weight: 400;
            }
            .brand p {
                font-size: 13px;
            }
            .surfaces {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
                margin-top: 24px;
            }
            .surface {
                display: grid;
                place-items: center;
                gap: 16px;
                padding: 24px;
                border: 1px solid #d7e7f3;
                border-radius: 16px;
            }
            .surface img {
                width: 72px;
                height: 72px;
            }
            .surface:nth-child(1) {
                background: #fff;
            }
            .surface:nth-child(2) {
                background: #e8f4ff;
            }
            .surface:nth-child(3) {
                background: #36536d;
                color: white;
            }
            .surface span {
                font-size: 14px;
            }
            footer {
                margin-top: 28px;
                font-size: 14px;
                color: #4d6780;
            }
            a {
                color: #2878c8;
                text-underline-offset: 4px;
            }
            a:focus-visible {
                outline: 2px solid #2878c8;
                outline-offset: 4px;
            }
            @media (max-width: 680px) {
                body {
                    padding: 28px 16px;
                }
                .grid {
                    grid-template-columns: 1fr;
                }
                .card {
                    padding: 22px;
                }
                .surfaces {
                    gap: 8px;
                }
                .surface {
                    padding: 20px 8px;
                }
                h1 {
                    font-size: 28px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header class="intro">
                <h1>译趣喵 · 白猫来信</h1>
                <p>圆润白猫、雾蓝信封，让品牌自然融入晴空来信的蓝白界面。</p>
            </header>
            <div class="grid">
                <figure class="card primary">
                    <img
                        src="mewcat-sky-logo.png"
                        alt="白猫从蓝色信封后探出头的译趣喵 Logo"
                        width="1254"
                        height="1254"
                    />
                    <figcaption>Logo · PNG · 1254 × 1254</figcaption>
                </figure>
                <section class="card">
                    <h2>界面中的实际尺寸</h2>
                    <div class="sizes">
                        <figure>
                            <img
                                src="mewcat-sky-logo.png"
                                alt="16 像素 Logo"
                                width="16"
                                height="16"
                            />
                            <figcaption>16 px</figcaption>
                        </figure>
                        <figure>
                            <img
                                src="mewcat-sky-logo.png"
                                alt="32 像素 Logo"
                                width="32"
                                height="32"
                            />
                            <figcaption>32 px</figcaption>
                        </figure>
                        <figure>
                            <img
                                src="mewcat-sky-logo.png"
                                alt="48 像素 Logo"
                                width="48"
                                height="48"
                            />
                            <figcaption>48 px</figcaption>
                        </figure>
                        <figure>
                            <img
                                src="mewcat-sky-logo.png"
                                alt="128 像素 Logo"
                                width="128"
                                height="128"
                            />
                            <figcaption>128 px</figcaption>
                        </figure>
                    </div>
                    <div class="brand">
                        <img
                            src="mewcat-sky-logo.png"
                            alt=""
                            width="48"
                            height="48"
                        />
                        <div>
                            <strong>译趣喵</strong>
                            <p>让每一种语言，都像来信般亲切。</p>
                        </div>
                    </div>
                </section>
            </div>
            <section class="surfaces" aria-label="不同背景下的 Logo">
                <div class="surface">
                    <img
                        src="mewcat-sky-logo.png"
                        alt=""
                        width="72"
                        height="72"
                    /><span>白色信纸</span>
                </div>
                <div class="surface">
                    <img
                        src="mewcat-sky-logo.png"
                        alt=""
                        width="72"
                        height="72"
                    /><span>浅蓝卡片</span>
                </div>
                <div class="surface">
                    <img
                        src="mewcat-sky-logo.png"
                        alt=""
                        width="72"
                        height="72"
                    /><span>深蓝背景</span>
                </div>
            </section>
            <footer>
                设计稿由内置 image_gen 生成。<a href="mewcat-sky-logo.png"
                    >查看原图</a
                >
                ·
                <a href="prompt.md">完整生成提示词</a
                >。本页保留设计原稿预览，Logo 已接入正式扩展图标。
            </footer>
        </main>
    </body>
</html>
