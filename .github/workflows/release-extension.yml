name: 扩展发布
on:
  push:
    branches:
      - main
    paths:
      - apps/extension/**
      - packages/**
      - scripts/**
      - tests/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - prettier.config.mjs
      - .prettierignore
      - eslint.config.mjs
      - tsconfig.json
      - .github/workflows/ci.yml
      - .github/workflows/release-extension.yml
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm test:workspace && pnpm build:packages && pnpm --filter @mewcat/extension check && pnpm build:verify extension
      - name: Resolve version and decide whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./apps/extension/package.json').version")"
          TAG="v${VERSION}"
          BUNDLE="mewcat-v${VERSION}-recovery.tar.gz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 已完成的 Release 直接跳过；未完成的 draft 只允许原提交恢复，
          # 并复用 draft 中的原始产物，防止同版本对应两份不同的 ZIP。
          if RELEASE_INFO="$(gh release view "$TAG" --json isDraft,targetCommitish,assets --jq '[.isDraft, .targetCommitish, ([.assets[].name] | join(","))] | @tsv' 2>/dev/null)"; then
            IFS=$'\t' read -r IS_DRAFT TARGET_COMMIT ASSET_NAMES <<< "$RELEASE_INFO"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "reuse_draft=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Release $TAG 已完成，跳过发布。要发新版请先 bump apps/extension/package.json 的 version。"
              exit 0
            fi
            if [ "$TARGET_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::draft Release $TAG 属于提交 $TARGET_COMMIT，当前提交为 $GITHUB_SHA。请升级 apps/extension/package.json version，禁止同版本跨提交覆盖。"
              exit 1
            fi
            if [[ ",${ASSET_NAMES}," == *",${BUNDLE},"* ]]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "reuse_draft=true" >> "$GITHUB_OUTPUT"
              echo "::notice::恢复 draft Release $TAG，并复用原始产物"
            else
              # recovery bundle 尚未上传成功时，CWS 步骤不可能已执行；
              # 可安全删除这个不完整 draft 并从同一提交重新构建。
              gh release delete "$TAG" --yes
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "reuse_draft=false" >> "$GITHUB_OUTPUT"
              echo "::notice::已清理缺少 recovery bundle 的不完整 draft，将重新构建 $TAG"
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG 已存在但没有对应 Release，拒绝覆盖。请升级 apps/extension/package.json version。"
            exit 1
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reuse_draft=false" >> "$GITHUB_OUTPUT"
            echo "::notice::将发布 $TAG"
          fi
      - name: Validate Sentry configuration
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.reuse_draft != 'true'
        env:
          WXT_SENTRY_DSN: ${{ vars.WXT_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          for name in WXT_SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 Sentry 配置 ${name}"
              exit 1
            fi
          done
      - name: Build
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.reuse_draft != 'true'
        env:
          WXT_SENTRY_DSN: ${{ vars.WXT_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build:extension
      - name: Write crx signing key
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.reuse_draft != 'true'
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY_B64" ]; then
            echo "::error::缺少仓库 Secret CRX_PRIVATE_KEY_B64。请用 \`node apps/extension/scripts/gen-crx-key.cjs\` 生成后添加。"
            exit 1
          fi

          # Secret 兼容两种粘贴方式：base64 串，或直接粘 apps/extension/key.pem 的 PEM 原文
          if printf '%s' "$CRX_PRIVATE_KEY_B64" | grep -q "BEGIN RSA PRIVATE KEY"; then
            printf '%s' "$CRX_PRIVATE_KEY_B64" > apps/extension/key.pem
          else
            printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 -d > apps/extension/key.pem
          fi

          # 校验落盘结果确实是一份完整私钥，避免带着损坏的 key 继续跑
          if ! grep -q "BEGIN RSA PRIVATE KEY" apps/extension/key.pem || ! grep -q "END RSA PRIVATE KEY" apps/extension/key.pem; then
            echo "::error::Secret CRX_PRIVATE_KEY_B64 解析后不是合法的 RSA 私钥。请确认粘贴的是 gen-crx-key.cjs 输出的完整 base64 串（单行、无空格换行），或 apps/extension/key.pem 的完整原文。"
            exit 1
          fi
      - name: Pack crx
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.reuse_draft != 'true'
        run: pnpm --filter @mewcat/extension crx
      - name: Collect release assets
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.reuse_draft != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-assets

          # 本地产物包含扩展名称、版本和时间；CI 保留固定资产名以复用 draft。
          ZIP="$(find apps/extension/.output -maxdepth 1 -type f -name "mewCat-${VERSION}-*.zip" -print -quit)"
          CRX="$(find apps/extension/release -maxdepth 1 -type f -name "mewCat-${VERSION}-*.crx" -print -quit)"
          if [ -z "$ZIP" ] || [ -z "$CRX" ]; then
            echo "::error::未找到 mewCat-${VERSION} 的 ZIP 或 CRX 构建产物"
            exit 1
          fi
          cp "$ZIP" "dist-assets/mewcat-v${VERSION}.zip"
          cp "$CRX" "dist-assets/mewcat-v${VERSION}.crx"

          (
            cd dist-assets
            sha256sum \
              "mewcat-v${VERSION}.zip" \
              "mewcat-v${VERSION}.crx" > SHA256SUMS
            tar -czf "mewcat-v${VERSION}-recovery.tar.gz" \
              "mewcat-v${VERSION}.zip" \
              "mewcat-v${VERSION}.crx" \
              SHA256SUMS
          )

          ls -lh dist-assets
      - name: Create draft GitHub Release
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.reuse_draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --prerelease \
            --draft \
            --target "${GITHUB_SHA}" \
            "dist-assets/mewcat-v${VERSION}-recovery.tar.gz"
      - name: Download draft release assets
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.reuse_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-assets
          gh release download "v${VERSION}" \
            --dir dist-assets \
            --pattern "mewcat-v${VERSION}-recovery.tar.gz"

          tar -xzf "dist-assets/mewcat-v${VERSION}-recovery.tar.gz" \
            -C dist-assets

          (
            cd dist-assets
            sha256sum -c SHA256SUMS
          )

          test -s "dist-assets/mewcat-v${VERSION}.zip"
          test -s "dist-assets/mewcat-v${VERSION}.crx"
      - name: Sync GitHub Release assets
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "v${VERSION}" --clobber \
            "dist-assets/mewcat-v${VERSION}.zip" \
            "dist-assets/mewcat-v${VERSION}.crx" \
            "dist-assets/SHA256SUMS"
      - name: Validate Chrome Web Store configuration
        if: steps.version.outputs.should_release == 'true'
        env:
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          for name in \
            CWS_WORKLOAD_IDENTITY_PROVIDER \
            CWS_SERVICE_ACCOUNT \
            CWS_PUBLISHER_ID \
            CWS_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 GitHub Actions Variable ${name}"
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud
        id: google-auth
        if: steps.version.outputs.should_release == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false
      - name: Publish to Chrome Web Store
        if: steps.version.outputs.should_release == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          CWS_ZIP_PATH: dist-assets/mewcat-v${{ steps.version.outputs.version }}.zip
        run: node apps/extension/scripts/chrome-web-store.cjs
      - name: Finalize GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --draft=false --prerelease
      - name: Remove temporary release files
        if: always()
        run: |
          rm -f -- "$GITHUB_WORKSPACE/apps/extension/key.pem"
          rm -rf -- "$GITHUB_WORKSPACE/apps/extension/.output" "$GITHUB_WORKSPACE/apps/extension/release" "$GITHUB_WORKSPACE/dist-assets"
env:
  MEWCAT_LOAD_LOCAL_ENV: "false"
